kind = "web"
previewPath = "/"
title = "FurtasticMatch"
version = "1.0.0"
id = "artifacts/furtastic-match"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20269

[services.development]
run = "pnpm --filter @workspace/furtastic-match run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/furtastic-match", "run", "build" ]
publicDir = "artifacts/furtastic-match/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20269"
BASE_PATH = "/"
