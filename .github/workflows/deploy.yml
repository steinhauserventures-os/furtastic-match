name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via VPS polling
        run: |
          echo "Push to main recorded."
          echo "VPS polls GitHub every 30s and deploys automatically."
          echo "Check deploy status: journalctl -u deploy-poll -n 20 on srv1616197"
