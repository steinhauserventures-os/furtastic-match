name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
        env:
          PNPM_CONFIG_MINIMUM_RELEASE_AGE: "0"

      - name: Build application
        run: |
          cd artifacts/furtastic-match
          pnpm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          cat > ~/.ssh/deploy_key << 'EOF'
          ${{ secrets.VPS_DEPLOY_KEY }}
          EOF
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 187.127.251.150 >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            artifacts/furtastic-match/dist/ \
            root@187.127.251.150:/var/www/furtasticmatch.com/

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key
